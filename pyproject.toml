[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "when2gram"
version = "0.1.0"
description = "Telegram-native When2Meet-style scheduling bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "aiogram>=3.28.2,<4",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
